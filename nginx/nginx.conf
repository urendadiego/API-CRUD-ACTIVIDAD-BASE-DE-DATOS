worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Muestra en el log qué réplica atendió cada pedido
    log_format balanceo '$remote_addr "$request" $status -> $upstream_addr';
    access_log /var/log/nginx/access.log balanceo;

    # Grupo de nodos de la API. Sin otra directiva, nginx usa round robin:
    # el 1er pedido va a api1, el 2do a api2, el 3ro a api3, y vuelve a empezar.
    # Los nombres los resuelve el DNS interno de Docker (son los servicios del compose).
    upstream api_eventos {
        server api1:3000 max_fails=3 fail_timeout=10s;
        server api2:3000 max_fails=3 fail_timeout=10s;
        server api3:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        # Front: el build de React (archivos estáticos)
        root  /usr/share/nginx/html;
        index index.html;

        # API: todo lo que empieza con /api/ se reparte entre las réplicas
        location /api/ {
            proxy_pass http://api_eventos;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Si una réplica se cae, reintenta el pedido en la siguiente
            proxy_next_upstream error timeout http_502 http_503;

            # Devuelve al navegador la IP:puerto del nodo que respondió
            add_header X-Upstream $upstream_addr always;
        }

        # React Router: cualquier ruta del front (/empresas/nueva, etc.) carga index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
